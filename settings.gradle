pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "GT-BMS"
include ':app'
include ':core'
// The desktop version (Compose for Desktop) is left out of phone-only builds such as F-Droid's
// (-Pfdroid): they need neither its libraries nor its native parts.
if (!startParameter.projectProperties.containsKey('fdroid')) include ':desktop'
include ':osmand-api'
